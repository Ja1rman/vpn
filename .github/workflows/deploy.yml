name: Deploy VPN infrastructure

# Manual only: publishing this repository must not consume Actions minutes.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy to existing servers
        type: choice
        required: true
        default: dashboards
        options:
          - dashboards
          - pool
          - monitoring
          - node-exporters
          - all

permissions:
  contents: read

concurrency:
  group: vpn-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.VPN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass apache2-utils openssl
      - name: Deploy selected component
        env:
          VPN_DEPLOY_ENABLED: ${{ vars.VPN_DEPLOY_ENABLED }}
          VPN_DEPLOY_COMPONENT: ${{ inputs.component }}
          VPN_MONITORING_USERNAME: ${{ vars.VPN_MONITORING_USERNAME }}
          VPN_MONITORING_PASSWORD: ${{ secrets.VPN_MONITORING_PASSWORD }}
          VPN_SSH_PASSWORDS_JSON: ${{ secrets.VPN_SSH_PASSWORDS_JSON }}
          VPN_SSH_KNOWN_HOSTS: ${{ secrets.VPN_SSH_KNOWN_HOSTS }}
          VPN_OUTBOUNDS_JSON: ${{ secrets.VPN_OUTBOUNDS_JSON }}
          VPN_MONITORING_TLS_JSON: ${{ secrets.VPN_MONITORING_TLS_JSON }}
          VPN_ALERTMANAGER_CONFIG: ${{ secrets.VPN_ALERTMANAGER_CONFIG }}
        run: python3 scripts/ci_deploy.py
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- .local
