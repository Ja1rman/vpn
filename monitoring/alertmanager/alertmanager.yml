global:
  resolve_timeout: 5m
route:
  receiver: web-only
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: web-only
inhibit_rules:
  - source_matchers: ['alertname="NodeUnavailable"']
    target_matchers: ['severity="warning"']
    equal: [host]
