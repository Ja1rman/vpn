modules:
  http_vpn:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_status_codes: [204]
      proxy_url: socks5://${VPN_LOOPBACK_IP}:${VPN_BALANCER_SOCKS_PORT}
      preferred_ip_protocol: ip4
  http_vpn_failover:
    prober: http
    timeout: 12s
    http:
      method: GET
      valid_status_codes: [204]
      proxy_url: socks5://${VPN_LOOPBACK_IP}:${VPN_FAILOVER_SOCKS_PORT}
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
