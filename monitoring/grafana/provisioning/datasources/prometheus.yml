apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://${VPN_LOOPBACK_IP}:${VPN_PROMETHEUS_PORT}
    isDefault: true
    editable: false
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://${VPN_LOOPBACK_IP}:${VPN_ALERTMANAGER_PORT}
    jsonData:
      implementation: prometheus
    editable: false
