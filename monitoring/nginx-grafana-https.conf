worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 0.0.0.0:443 ssl;
    server_name __GRAFANA_PUBLIC_IP__;
    ssl_certificate /etc/vpn-failover-subscription/tls.pem;
    ssl_certificate_key /etc/vpn-failover-subscription/tls.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:grafana_tls:4m;
    ssl_session_tickets off;
    absolute_redirect off;
    client_max_body_size 10m;

    location = / { return 302 /grafana/; }
    location = /grafana { return 308 /grafana/; }
    location /grafana/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host __GRAFANA_PUBLIC_IP__;
      proxy_set_header X-Forwarded-Host __GRAFANA_PUBLIC_IP__;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 10m;

      # Grafana keeps its original HTTP root URL for the separate port-80 frontend.
      # Rewrite its canonical public origin only, leaving all other links alone.
      proxy_redirect http://__GRAFANA_PUBLIC_IP__/grafana/ https://__GRAFANA_PUBLIC_IP__/grafana/;
      proxy_set_header Accept-Encoding '';
      sub_filter 'http://__GRAFANA_PUBLIC_IP__/grafana/' 'https://__GRAFANA_PUBLIC_IP__/grafana/';
      sub_filter_once off;
      sub_filter_types application/json;
      proxy_cookie_flags grafana_session secure httponly;
      proxy_cookie_flags ~^ secure;
    }
    location / { return 404; }
  }
}
