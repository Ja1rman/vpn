worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 0.0.0.0:80;
    client_max_body_size 10m;
    location = / { return 302 /grafana/; }
    location = /grafana { return 302 /grafana/; }
    location /grafana/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location = /alerts { return 302 /alerts/; }
    location /alerts/ {
      auth_basic 'VPN monitoring';
      auth_basic_user_file /etc/nginx/monitoring.htpasswd;
      proxy_pass http://127.0.0.1:9093/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Prefix /alerts;
      proxy_set_header Authorization '';
    }
    location = /prometheus { return 302 /prometheus/; }
    location /prometheus/ {
      auth_basic 'VPN monitoring';
      auth_basic_user_file /etc/nginx/monitoring.htpasswd;
      proxy_pass http://127.0.0.1:9090/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Prefix /prometheus;
      proxy_set_header Authorization '';
    }
    location / { return 404; }
  }
}
